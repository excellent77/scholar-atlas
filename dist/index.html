<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholar Atlas — 教授研究整理器</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#"><span class="logo">S<span>✳</span></span><div>Scholar Atlas<small>你的研究申請地圖</small></div></a><div class="section-label">WORKSPACE</div><button class="nav active" data-view="library">▦　教授研究庫</button><button class="nav" data-view="compare">⇄　研究契合比較</button><button class="nav" data-view="guide">↗　使用與專案規則</button><div class="side-line"></div><div class="section-label">研究興趣</div><textarea id="interests" aria-label="我的研究興趣" placeholder="以逗號分隔，例如：GFlowNet, optimization, LLM"></textarea><small class="hint">用於比對已收錄論文的關鍵字，不代表錄取機率。</small><div class="side-bottom"><span class="dot"></span> 瀏覽器本機工作區<small>資料僅儲存在這台裝置，請定期備份。</small><button id="backup">↓ 備份工作區</button><label class="file-btn">↑ 匯入備份<input type="file" id="restore" accept=".json"></label></div></aside><main><header><div class="breadcrumb">我的工作區 <span>/</span> <b id="crumb">教授研究庫</b></div><span class="pill">APPLICATION RESEARCH</span></header><div id="content"></div><footer>Scholar Atlas · 從閱讀論文，到找到研究方向。<span>資料來源可追溯 · 不自動寄信</span></footer></main><dialog id="editor"><form id="editForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" aria-label="關閉">×</button></div><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
