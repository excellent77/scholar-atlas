<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Scholar Atlas｜原文研究工作區</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#"><span class="logo">S<span>✳</span></span><div>Scholar Atlas<small>原文・證據・研究方向</small></div></a><div class="section-label">RESEARCH WORKSPACE</div><button class="nav active" data-view="library">▱　教授資料夾</button><button class="nav" data-view="model">✧　分析模型設定</button><button class="nav" data-view="guide">↗　使用與開發規則</button><div class="side-line"></div><div class="section-label">實體資料位置</div><p class="hint" id="folderStatus">尚未選取資料夾</p><button id="connect">選取電腦資料夾</button><button id="refresh" hidden>重新讀取資料</button><div class="side-bottom"><span class="dot"></span><span id="modelStatus">模型尚未設定</span><small>PDF 在本機擷取文字。按下分析並同意後，才將文字送至你設定的 Gemini 帳戶。</small><small>不含任何範例教授或論文。</small></div></aside><main><header><div class="breadcrumb">研究工作區 <span>/</span> <b id="crumb">教授資料夾</b></div><span class="pill">SOURCE-GROUNDED RESEARCH · V2</span></header><div id="job" hidden role="status"><span id="jobText"></span><button id="cancelJob">取消</button></div><div id="content"></div><footer>Scholar Atlas · 讓每個研究判斷，都能回到原文。<span>引用可核對 · 推論明確標示</span></footer></main><dialog id="editor"><form id="editForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog" aria-label="關閉">×</button></div><div id="fields"></div><div class="dialog-actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">儲存到資料夾</button></div></form></dialog><dialog id="evidence" class="evidence"><div class="dialog-head"><h2 id="evidenceTitle">原文證據</h2><button id="closeEvidence" aria-label="關閉原文">×</button></div><div id="evidenceBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="app.js"></script></body></html>
